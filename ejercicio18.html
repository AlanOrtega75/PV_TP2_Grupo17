<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 18</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #74acdf 0%, #74acdf 34%, #ffffff 34%, #ffffff 66%, #74acdf 66%, #74acdf 100%);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            border: 3px solid #004c99;
            padding: 28px;
            width: 380px;
            max-width: calc(100% - 40px);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);
        }
        .container h2 {
            font-size: 2.4rem;
            margin: 0;
            color: #003366;
        }
    </style>
</head>
<body>

<script>

const calcularMayor = (numero1, numero2) => {

    if(numero1 > numero2){

        return `${numero1} es mayor`;

    }else if(numero2 > numero1){

        return `${numero2} es mayor`;

    }else{

        return "Los números son iguales";
    }
};

const numero1 = Number(prompt("Ingrese el primer número"));
const numero2 = Number(prompt("Ingrese el segundo número"));

document.write(`
    <div class="container">
        <h2>${calcularMayor(numero1, numero2)}</h2>
    </div>
`);

</script>

</body>
</html>
