<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        const calcularMayor = (numero1, numero2) => {
    if (numero1 > numero2) {
        document.write(`<h2>El número mayor es ${numero1}</h2>`);
    } else if (numero2 > numero1) {
        document.write(`<h2>El número mayor es ${numero2}</h2>`);
    } else {
        document.write(`<h2>Los números son iguales</h2>`);
    }
};
const numero1 = parseInt(prompt("Ingrese el primer número"));
const numero2 = parseInt(prompt("Ingrese el segundo número"));
calcularMayor(numero1, numero2);
    </script>
</body>
</html>
