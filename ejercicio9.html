<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #74acdf 0%, #74acdf 33%, #ffffff 33%, #ffffff 66%, #74acdf 66%, #74acdf 100%);
            font-family: Arial, sans-serif;
        }
        .container {
            border: 3px solid #004c99;
            padding: 30px;
            width: 420px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.18);
        }
        .container h2 {
            font-size: 2.2rem;
            margin: 0 0 15px;
        }
        .container p {
            font-size: 1.3rem;
            margin: 0;
        }
    </style>
</head>
<body>

<script>

const apellido = prompt("Ingrese su apellido");
const nombre = prompt("Ingrese su nombre");

document.write(`
    <div class="container">
        <h2>¡Hola ${nombre} ${apellido}!</h2>
        <p>Bienvenido a Programación Visual</p>
    </div>
`);

</script>

</body>
</html>
