<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>
    <script>
        const kilometros = parseFloat(prompt("Ingrese los kilometros recorridos"));
        const litros = parseFloat(prompt("Ingrese los litros consumidos"));

        const consumo = litros / kilometros;

        document.write(`<h2>Kilometros recorridos: ${kilometros}km</h2>`);
        document.write(`<h2>Litros consumidos: ${litros}L</h2>`);
        document.write(`<h2>Consumo por kilometro: ${consumo}L/km</h2>`);
    </script> 
</body>
</html>
