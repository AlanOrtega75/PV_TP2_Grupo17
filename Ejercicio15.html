<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
</head>
<body>
<script>
const retornarMes = (numero) => {
    const meses = [
        "Enero", "Febrero", "Marzo",
        "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre",
        "Octubre", "Noviembre", "Diciembre"
    ];
    if (numero >= 1 && numero <= 12) {
        return meses[numero - 1];
    } else {
        return "No corresponde a un mes";
    }
};
const numero = parseInt(prompt("Ingrese un número del 1 al 12"));
const resultado = retornarMes(numero);
document.write(`<h2>${resultado}</h2>`);
</script>
</body>
</html>
