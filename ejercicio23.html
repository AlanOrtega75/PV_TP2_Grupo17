<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 23</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #f3f7ff 0%, #dce9ff 45%, #f8fbff 100%);
        }
        .container {
            width: 520px;
            max-width: calc(100% - 32px);
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #c8d8f8;
            border-radius: 20px;
            box-shadow: 0 18px 32px rgba(0, 45, 120, 0.12);
            padding: 32px;
        }
        h1 {
            font-size: 2rem;
            color: #112d53;
            margin: 0 0 14px;
            text-align: center;
        }
        p.subtitle {
            margin: 0 0 24px;
            color: #4b5f84;
            text-align: center;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #122a52;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #b8c7e5;
            font-size: 1rem;
            color: #152a4d;
            background: #f7faff;
            box-sizing: border-box;
            margin-bottom: 22px;
        }
        .output {
            min-height: 72px;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid #d6e0f6;
            background: #eef4ff;
            color: #18305f;
            font-size: 1.1rem;
            line-height: 1.6;
            transition: background-color 0.3s ease;
            white-space: pre-wrap;
        }
        .output.long {
            background: #ffeccf;
            border-color: #f2d8a8;
            color: #5b3a00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Texto en vivo</h1>
        <p class="subtitle">Escribe en el campo y verás el texto reflejado en tiempo real. Si supera 20 caracteres, cambia el fondo.</p>
        <label for="entrada">Escribir texto</label>
        <input type="text" id="entrada" placeholder="Ingresa texto aquí...">
        <div id="resultado" class="output">El texto ingresado aparecerá aquí.</div>
    </div>
    <script src="js/ejercicio23.js"></script>
</body>
</html>
