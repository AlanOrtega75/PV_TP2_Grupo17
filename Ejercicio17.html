<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
</head>
<body>
<script>
const contarLetraA = (texto) => {
    let contador = 0;
    for (let i = 0; i < texto.length; i++) {
        if (texto[i].toLowerCase() === "a") {
            contador++;
        }
    }
    return contador;
};
const cadena = prompt("Ingrese un texto");
const resultado = contarLetraA(cadena);
document.write(`<h2>La letra "a" aparece ${resultado} veces</h2>`);
</script>
</body>
</html>
