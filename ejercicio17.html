<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #74acdf 0%, #74acdf 34%, #ffffff 34%, #ffffff 66%, #74acdf 66%, #74acdf 100%);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            border: 3px solid #004c99;
            padding: 28px;
            width: 420px;
            max-width: calc(100% - 40px);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0,0,0,0.18);
        }
        .container h2 {
            font-size: 2.4rem;
            margin: 0 0 16px;
            color: #003366;
        }
        .container p {
            font-size: 1.3rem;
            margin: 0;
        }
    </style>
</head>
<body>

<script>

const contarLetraA = (texto) => {

    let contador = 0;

    for(let letra of texto.toLowerCase()){

        if(letra === "a"){

            contador++;
        }
    }

    return contador;
};

const texto = prompt("Ingrese un texto");

document.write(`
    <div class="container">
        <h2>Resultado</h2>
        <p>La letra "a" aparece ${contarLetraA(texto)} veces</p>
    </div>
`);

</script>

</body>
</html>
