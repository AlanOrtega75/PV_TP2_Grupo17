<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 20</title>
    <style>
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.15) 0%, transparent 35%),
                        linear-gradient(180deg, #0f1f38 0%, #122846 40%, #08152a 100%);
            color: #1f2f4f;
        }

        .contenedor {
            width: 480px;
            max-width: calc(100% - 32px);
            margin: 24px auto;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 34px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 2rem;
            color: #10294e;
        }

        input {
            width: 100%;
            margin-bottom: 16px;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #c1cde1;
            border-radius: 14px;
            box-sizing: border-box;
            background: #f7f9ff;
            color: #10294e;
        }

        button {
            padding: 14px 16px;
            width: 100%;
            font-size: 1.05rem;
            border: none;
            border-radius: 14px;
            background: #0f3c72;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 14px 22px rgba(15, 60, 114, 0.24);
        }

        button:hover {
            transform: translateY(-2px);
            background: #0b305f;
        }

        .resultado {
            margin-top: 24px;
            font-size: 1.15rem;
            color: #10294e;
            text-align: left;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Ejercicio 20</h1>
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="apellido" placeholder="Apellido">
    <input type="text" id="libreta" placeholder="Libreta Universitaria">
    <button id="mostrar">Mostrar datos</button>
    <div id="resultado" class="resultado"></div>
</div>
<script type="module" src="PV_TP2_Grupo17/js/ejercicio20.js"></script>
</body>
</html>
