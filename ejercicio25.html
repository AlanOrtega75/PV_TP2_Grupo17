<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 25 - Cambiar color de fondo</title>
    <style>
        :root {
            --bg-start: #0f2347;
            --bg-end: #295a8e;
            --card: rgba(255, 255, 255, 0.96);
            --border: rgba(255, 255, 255, 0.45);
            --text: #10294e;
            --accent: #ffb347;
            --accent-dark: #de8a1d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, #5f8ee0 0%, transparent 30%),
                        linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background-color 0.4s ease;
        }

        .container {
            width: 560px;
            max-width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(12, 31, 60, 0.18);
            padding: 32px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
            letter-spacing: -0.03em;
        }

        p.subtitle {
            margin: 0 0 28px;
            color: #4b5f80;
            line-height: 1.65;
        }

        .action-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #122138;
            border: none;
            border-radius: 16px;
            padding: 16px 30px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 18px 30px rgba(255, 180, 76, 0.22);
        }

        button:hover {
            transform: translateY(-2px);
        }

        .message {
            margin: 0;
            padding: 18px 22px;
            width: 100%;
            border-radius: 18px;
            background: #eef3fb;
            border: 1px solid #dbe5f6;
            color: #16355e;
            font-size: 1rem;
            text-align: center;
        }

        .message span {
            font-weight: 700;
            color: #0f2347;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cambiar color de fondo</h1>
        <p class="subtitle">Presiona el botón para cambiar el color de fondo de toda la página. Cada clic selecciona un color distinto y se registra el cambio en la consola.</p>

        <div class="action-panel">
            <button id="changeColorBtn" type="button">Cambiar color de fondo</button>
            <p class="message">Color actual: <span id="colorName">Azul degradado</span></p>
        </div>
    </div>
    <script src="js/ejercicio25.js"></script>
</body>
</html>
