<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>
<body>
    <script>
        const cantidad = parseInt(prompt("¿Cuántos números desea ingresar?"));
        const numeros = [];
        for (let i = 0; i < cantidad; i++) {
            const numero = parseInt(prompt(`Ingrese el número ${i + 1}`));
        numeros.push(numero);
    }
    const duplicar = (arreglo) => {
        const nuevoArreglo = [];
        arreglo.forEach((numero) => {
            nuevoArreglo.push(numero * 2);
        });
    return nuevoArreglo;
    };
    const resultado = duplicar(numeros);
    document.write(`<h2>Arreglo original: ${numeros}</h2>`);
    document.write(`<h2>Arreglo duplicado: ${resultado}</h2>`);
    </script>
</body>
</html>
